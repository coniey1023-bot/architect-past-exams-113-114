<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="考選部 113、114 年建築師考試考古題整理">
<title>建築師考古題｜113・114 年</title>
<style>
:root{--ink:#17212b;--muted:#63727e;--paper:#f6f3ed;--card:#fffdf8;--line:#e5ded2;--accent:#b45532;--teal:#23686b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}a{color:inherit}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}header{padding:64px 0 42px;background:linear-gradient(135deg,#f4eee5,#fbfaf6 58%,#e8f0ed);border-bottom:1px solid var(--line)}.eyebrow{color:#79341f;font-size:.8rem;font-weight:800;letter-spacing:.14em}h1{margin:12px 0;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(2.3rem,6vw,4.5rem);line-height:1.08;letter-spacing:-.04em}.lede{max-width:700px;color:var(--muted);font-size:1.05rem}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.stats div{padding:13px 18px;border:1px solid #d9d5cb;border-radius:16px;background:#ffffff9c}.stats b{display:block;font-size:1.5rem;line-height:1.2}.stats span{color:var(--muted);font-size:.85rem}main{padding:34px 0 66px}.bar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}.bar h2{margin:0;font-size:1.4rem}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}button.active,button:hover{color:#fff;background:var(--accent);border-color:var(--accent)}input{width:230px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{position:relative;display:flex;flex-direction:column;min-height:245px;padding:22px 22px 20px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 14px 34px #2d23120e}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;border-radius:20px 0 0 20px;background:var(--accent)}.card.y113:before{background:var(--teal)}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tag{padding:3px 9px;border-radius:999px;background:#f4e2d8;color:#79341f;font-size:.8rem;font-weight:800}.y113 .tag{background:#dcebea;color:#18585a}h3{margin:0 0 6px;font-size:1.25rem}.code,.kind{margin:0;color:var(--muted);font-size:.9rem}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:20px}.links a{padding:8px 11px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-size:.86rem;font-weight:700}.links a.alt{background:#eee9df;color:var(--ink)}.links a:hover{background:var(--teal);color:#fff}.note{margin-top:26px;padding:18px 20px;border:1px solid #d7e5e2;border-radius:16px;background:#edf5f3;color:#255458}.note b{display:block;margin-bottom:4px}.empty{display:none;padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}footer{padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}footer a{color:#79341f}@media(max-width:720px){header{padding-top:42px}.grid{grid-template-columns:1fr}.bar{align-items:stretch}input{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">第五堂課 · 考試資料整理</div><h1>建築師考古題<br><span style="color:var(--accent)">113・114 年</span></h1><p class="lede">集中整理考選部公開的近兩年建築師考試試題，依年度與科目快速查找；點擊即可開啟官方 PDF，測驗科目另附標準答案與更正答案。</p><div class="stats"><div><b>12</b><span>份官方試題</span></div><div><b>6</b><span>科考試科目</span></div><div><b>2</b><span>個考試年度</span></div></div></div></header>
<main class="wrap"><div class="bar"><div><h2>試題清單</h2><div id="count" style="color:var(--muted);font-size:.9rem"></div></div><div class="controls"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="114">114 年</button><button class="filter" data-filter="113">113 年</button><input id="search" type="search" placeholder="搜尋科目名稱…" aria-label="搜尋科目名稱"></div></div><section id="grid" class="grid"></section><div id="empty" class="empty">找不到符合條件的科目。</div><div class="note"><b>使用說明</b>本頁為課程用索引，試題與答案 PDF 皆連回考選部「考畢試題查詢平台」官方檔案；若官方日後更新答案，請以官方頁面為準。</div></main>
<footer><div class="wrap">資料整理：第五堂課／建築師考古題　·　<a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=114180&y=2025" target="_blank" rel="noopener">114 年考選部查詢平台</a>　·　<a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=113190&y=2024" target="_blank" rel="noopener">113 年考選部查詢平台</a></div></footer>
<script>
const subjects=[['營建法規與實務','1801','測驗題','80 題單選，每題 1.25 分','0101'],['建築結構','2801','混合題','申論式 40%＋測驗式 60%','0102'],['建築構造與施工','3801','測驗題','80 題單選，每題 1.25 分','0103'],['建築環境控制','4801','混合題','申論式 40%＋測驗式 60%','0104'],['敷地計畫與都市設計','5801','申論題','申論式試題','0105'],['建築計畫與設計','6801','申論題','申論式試題','0106']];
const years=[114,113];const grid=document.querySelector('#grid');const search=document.querySelector('#search');const count=document.querySelector('#count');const empty=document.querySelector('#empty');let selected='all';
function url(year,s,type){return 'https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=801&code='+(year===114?'114180':'113190')+'&q=1&s='+s+'&t='+type}
function render(){let q=search.value.trim().toLowerCase(),n=0,html='';years.forEach(year=>subjects.forEach(item=>{let show=(selected==='all'||selected===String(year))&&item[0].toLowerCase().includes(q);if(!show)return;n++;let answer=item[4]<'0105'?'<a class="alt" href="'+url(year,item[4],'S')+'" target="_blank" rel="noopener">標準答案</a><a class="alt" href="'+url(year,item[4],'M')+'" target="_blank" rel="noopener">更正答案</a>':'';html+='<article class="card y'+year+'"><div class="tags"><span class="tag">'+year+' 年</span><span class="tag">'+item[2]+'</span></div><h3>'+item[0]+'</h3><p class="code">試題代號：'+item[1]+'</p><p class="kind">'+item[3]+'</p><div class="links"><a href="'+url(year,item[4],'Q')+'" target="_blank" rel="noopener">開啟試題 ↗</a>'+answer+'</div></article>'}));grid.innerHTML=html;count.textContent='目前顯示 '+n+' 份試題';empty.style.display=n?'none':'block'}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));search.addEventListener('input',render);render();
</script>
</body></html>
